resolver 127.0.0.11 valid=10s ipv6=off;

proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=uploads_cache:10m max_size=1g inactive=30d;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bot → SSR
    location / {
        set $bot 0;
        if ($http_user_agent ~* "(bot|crawl|spider|googlebot|yandexbot|bingbot|facebookbot)") {
            set $bot 1;
        }
        if ($bot = 1) {
            rewrite ^ /render$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    # SSR render endpoints
    location /render/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API → backend
    location ^~ /api/ {
        set $backend ${BACKEND_URL};
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Images → backend (on-the-fly compression: default q70, ?type=thumb preview, ?type=full original)
    location ~* ^/uploads/[\w./-]+\.(jpe?g|jfif|png|gif|webp|ico|pdf|svg|avif)$ {
        rewrite ^/uploads/(.+)$ /api/uploads/$1 break;
        set $backend ${BACKEND_URL};
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_cache uploads_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ~ ^/uploads/ {
        return 403;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
